name: Publish

# Release every package at once:
#   node scripts/version.mjs minor && git push --follow-tags
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # GitHub release
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches the packages
        run: |
          version="v$(node -p "require('./packages/ymir-js/package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/ymir-js ($version)"
            exit 1
          fi

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Publishes each package whose version is not on npm yet, core first.
      # Uses trusted publishing; an NPM_TOKEN secret, if set, is used instead
      # (needed once for a package's very first publish).
      - run: node scripts/publish.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
