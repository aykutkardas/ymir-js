name: Publish

# Push a version tag to release:
#   npm version minor && git push --follow-tags
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # GitHub release
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($version)"
            exit 1
          fi

      # A version published by hand is not published again; the release
      # below is still created.
      - name: Check whether this version is already on npm
        id: npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "ymir-js@$version" version >/dev/null 2>&1; then
            echo "ymir-js@$version is already on npm; skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # prepublishOnly runs typecheck, test and build first.
      - if: steps.npm.outputs.published != 'true'
        run: npm publish --provenance --access public

      - name: Create GitHub release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
